repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: no-secrets
        name: Check for secrets
        entry: scripts/check-no-secrets.sh
        language: script
        types: [text]
      - id: protected-files
        name: Check protected files
        entry: scripts/check-protected-files.sh
        language: script
        pass_filenames: false
